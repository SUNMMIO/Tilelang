name: 🤔 Questions / Help / Support
description: Do you need support?
title: "[Question] "
labels: [question]
body:
  - type: checkboxes
    id: steps
    attributes:
      label: Required prerequisites
      description: Make sure you've completed the following steps before submitting your issue -- thank you!
      options:
        - label: I have read the TileLang-Mesh documentation in this repository.
          required: true
        - label: >-
            I have searched the [Issue Tracker](https://github.com/SUNMMIO/Tilelang/issues)
            and confirmed this has not already been answered.
          required: true

  - type: textarea
    id: questions
    attributes:
      label: Questions
      description: Describe your questions with relevant resources such as snippets, links, images, etc.
    validations:
      required: true
