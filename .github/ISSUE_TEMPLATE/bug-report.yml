name: 🐛 Bug Report
description: File an issue about a bug.
title: "[BUG] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: >-
        Please make the issue as easy to reproduce as possible, and only submit
        it here if the problem is specific to TileLang-Mesh.

  - type: checkboxes
    id: steps
    attributes:
      label: Required prerequisites
      description: Make sure you've completed the following steps before submitting your issue -- thank you!
      options:
        - label: I have read the TileLang-Mesh documentation in this repository.
          required: true
        - label: >-
            I have searched the [Issue Tracker](https://github.com/SUNMMIO/Tilelang/issues)
            and confirmed this has not already been reported.
          required: true
        - label: I am not reporting credentials, private logs, or proprietary hardware information.
          required: true

  - type: input
    id: version
    attributes:
      label: What version of TileLang-Mesh are you using?
      description: >-
        Run `python -m pip show tilelang-mesh` and
        `python -c 'import tilelang; print(tilelang.__version__)'`, then paste both outputs.
      placeholder: E.g., distribution 0.1.0, import 0.1.0
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System information
      description: |
        Describe the characteristic of your environment:

        - Describe how the library was installed (Release wheel, source, ...)
        - Python version
        - Torch and accelerator-toolkit versions
        - Enabled backends and whether NPU-IR access is available
        - Git commit for a source installation

        ```python
        import importlib.metadata
        import sys, tilelang, torch
        print(sys.version, sys.platform)
        print(importlib.metadata.version("tilelang-mesh"))
        print(tilelang.__version__)
        print(torch.__version__)
        ```

        ```bash
        python3 -m torch.utils.collect_env
        ```
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: >-
        Provide a short description, state the expected behavior and what actually happens. Include
        relevant information like what version of TileLang-Mesh you are using, what system you are on, and
        any useful commands / output.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Reproducible example code
      description: >-
        The code should be minimal, have minimal external dependencies, and isolate the functions
        that cause breakage. Submit matched and complete snippets that can be easily run to diagnose
        the issue.
      value: |
        The Python snippets:

        ```python

        ```
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      description: Put the Python traceback information here.
      placeholder: |
        Traceback (most recent call last):
          File ...
      render: pytb

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Provide a clear and concise description of what you expected to happen.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: >-
        Add any other context about the problem here. Screenshots may also be helpful.

        If you know or suspect the reason for this bug, paste the code lines and suggest modifications.
