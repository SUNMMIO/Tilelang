[project]
name = "tilelang-mesh"
description = "TileLang extensions for distributed-memory accelerators."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SUNMMIO Ltd." }, { name = "TileLang Contributors" }, { name = "Tile-AI" }]
maintainers = [{ name = "SUNMMIO", email = "loujianguang@sunmmio.com" }]
# TileLang-Mesh is MIT-licensed; the remaining terms cover bundled or vendored material.
license = "MIT AND Apache-2.0 AND (Apache-2.0 WITH LLVM-exception) AND BSD-2-Clause AND BSD-3-Clause AND Zlib AND Unlicense"
license-files = [
    "LICENSE",
    "THIRDPARTYNOTICES.txt",
    "3rdparty/tvm/LICENSE",
    "3rdparty/tvm/NOTICE",
    "3rdparty/tvm/licenses/*.txt",
    "3rdparty/cutlass/LICENSE.txt",
    "3rdparty/composable_kernel/LICENSE",
]
keywords = ["NMC", "NUMA", "TileLang", "Code Generation", "Mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

dependencies = [
    # Pin to the last known-good wheel. apache-tvm-ffi 0.1.10 enforces
    # __slots__ on Object subclasses, which is incompatible with the pinned
    # vendored TVM Python derived_object wrappers in this repo.
    "apache-tvm-ffi==0.1.9",
    # torch-c-dlpack-ext provides prebuilt torch extensions.
    # Without it, TVM FFI may require JIT compilation on first import.
    "torch-c-dlpack-ext; python_version < '3.14'",
    "cloudpickle",
    "ml-dtypes",
    "numpy>=1.23.5",
    "psutil",
    "torch",
    "torch>=2.4; platform_system == 'Darwin'",
    # jit-compiling a torch extension needs setuptools
    "setuptools; platform_system == 'Darwin'",
    "tqdm>=4.62.3",
    "typing-extensions>=4.10.0",
    "z3-solver>=4.13.0,<4.15.5",
]

[project.urls]
Homepage = "https://github.com/SUNMMIO/Tilelang"
Repository = "https://github.com/SUNMMIO/Tilelang"
Documentation = "https://github.com/SUNMMIO/Tilelang/tree/tilelang_mesh_main/docs"
Issues = "https://github.com/SUNMMIO/Tilelang/issues"
Changelog = "https://github.com/SUNMMIO/Tilelang/blob/tilelang_mesh_main/CHANGELOG.md"

[project.optional-dependencies]
# mldtypes should be greater than 0.5.1
# if you want to enable fp4
fp4 = ["ml-dtypes>=0.5.1"]
# if you want to enable layout inference visualization
vis = ["matplotlib"]
# if you want to build with CUDA NVCC support
nvcc = [
    "nvidia-cuda-nvcc>=13.0.48",
    "nvidia-cuda-cccl>=13.0.50",
]
# if you want to build and execute Sunmmio kernels through the sunsim/gem5 path
sunmmio = ["sunsim"]
# explicit alias for the sunsim/gem5 execution backend
sunmmio-sunsim = ["sunsim"]

[[tool.uv.index]]
name = "sunmmio"
url = "https://gitlab.sunmmio.com:6226/api/v4/projects/118/packages/pypi/simple"
explicit = true

[tool.uv.sources]
sunsim = { index = "sunmmio" }

[build-system]
requires = [
    "cython>=3.1.0",
    "scikit-build-core",
    "z3-solver>=4.13.0,<4.15.5",
    # Not for auditwheel, explicitly add patchelf for repairing libz3.so.
    # See tvm's CMakeLists.txt for more information.
    "patchelf>=0.17.2; platform_system == 'Linux'",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.py-api = "cp312"
cmake.version = ">=3.26.1"
build-dir = "build"

# editable.rebuild = true

# Include backend and git info in version
metadata.version.provider = "version_provider"
metadata.version.provider-path = "."
experimental = true

# build.verbose = true
# logging.level = "DEBUG"

[tool.scikit-build.sdist]
include = [
    "./VERSION",
    ".git_commit.txt",
    "./LICENSE",
    "CHANGELOG.md",
    "THIRDPARTYNOTICES.txt",
    "3rdparty/tvm/LICENSE",
    "3rdparty/cutlass/LICENSE.txt",
    "3rdparty/composable_kernel/LICENSE",
    "version_provider.py",
    "requirements*.txt",
    "tilelang/jit/adapter/cython/cython_wrapper.pyx",
    "CMakeLists.txt",
    "src/**",
    "cmake/**",
    # The vendored 3rdparty contents in sdist should be same as wheel.
    # Need full TVM to build from source.
    "3rdparty/tvm",
    # CUTLASS
    "3rdparty/cutlass/include",
    "3rdparty/cutlass/tools",
    # Composable Kernel
    "3rdparty/composable_kernel/include",
    "3rdparty/composable_kernel/library",
    # HiGHS is required to build the Sunmmio ILP pipeline planner.
    "3rdparty/highs",
    "testing/**",
    "examples/**",
]
exclude = [
    ".git",
    ".github",
    "**/.git",
    "**/.github",
    "3rdparty/**",
    "build",
]

[tool.scikit-build.wheel.packages]
tilelang = "tilelang"
"tilelang/src" = "src"
# NOTE: The mapping below places the contents of '3rdparty' inside 'tilelang/3rdparty' in the wheel.
# This is necessary to find TVM shared libraries at runtime.
# The vendored 3rdparty contents in wheel should be same as sdist.
# TVM
"tilelang/3rdparty/tvm/src" = "3rdparty/tvm/src"
"tilelang/3rdparty/tvm/python" = "3rdparty/tvm/python"
"tilelang/3rdparty/tvm/include" = "3rdparty/tvm/include"
"tilelang/3rdparty/tvm/3rdparty/dmlc-core/include" = "3rdparty/tvm/3rdparty/dmlc-core/include"
"tilelang/3rdparty/tvm/version.py" = "3rdparty/tvm/version.py"
# CUTLASS
"tilelang/3rdparty/cutlass/include" = "3rdparty/cutlass/include"
"tilelang/3rdparty/cutlass/tools" = "3rdparty/cutlass/tools"
# Composable Kernel
"tilelang/3rdparty/composable_kernel/include" = "3rdparty/composable_kernel/include"
"tilelang/3rdparty/composable_kernel/library" = "3rdparty/composable_kernel/library"



[tool.codespell]
ignore-words = "docs/spelling_wordlist.txt"
skip = [
    "build",
    "3rdparty",
    "dist",
    ".venv"
]

[tool.ruff]
# Keep the upstream syntax baseline; requires-python defines runtime support.
target-version = "py39"
line-length = 140
output-format = "full"

exclude = [
    "3rdparty",
    "examples/deepseek_v32/inference",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
# Do not upgrade type hint in testing and examples.
# See https://github.com/tile-ai/tilelang/issues/1079 for more information.
"testing/**.py" = ["UP", "FA"]
"examples/**.py" = ["UP", "FA"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP", "FA",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # if-else-block instead of ternary
    "SIM108",
    # key in dict.keys()
    "SIM118",
    # open file w.o. ctx manager
    "SIM115",
    # memory leaks
    "B019",
    # zip without explicit strict
    "B905",
    # No such file or directory
    "E902",
]

[tool.pytest.ini_options]
verbosity_assertions = 3
filterwarnings = ["always"]

[tool.cibuildwheel]
archs = ["x86_64"]
build = "cp312-manylinux_x86_64"
build-frontend = "build"
environment = { PYTHONDEVMODE = "1", PYTHONUNBUFFERED = "1", CMAKE_ARGS = "-DTILELANG_UPDATE_SUBMODULES=OFF -DUSE_CUDA=OFF -DUSE_ROCM=OFF -DUSE_METAL=OFF -DUSE_SUNMMIO=ON" }
environment-pass = [
    "NO_VERSION_LABEL",
    "NO_TOOLCHAIN_VERSION",
    "NO_GIT_VERSION",
    "COLUMNS",
    "CMAKE_GENERATOR",
    "CMAKE_BUILD_PARALLEL_LEVEL",
    "FORCE_COLOR",
    "CLICOLOR_FORCE",
]
before-build = "env -0 | sort -z | tr '\\0' '\\n'"
before-test = "pip install --index-url https://download.pytorch.org/whl/cpu torch"
test-command = [
    "python -c 'from importlib.metadata import version; import tilelang; assert tilelang.__version__ == version(\"tilelang-mesh\")'",
    "python -c 'from tilelang import tvm; assert tvm.ffi.get_global_func(\"target.build.tilelang_sunmmio_without_compile\", allow_missing=True) is not None'",
    "python -c 'from tilelang.jit.adapter.sunmmio.libgen import find_npuir_tool; [find_npuir_tool(name) for name in (\"npuir-opt\", \"npuir-translate\", \"npuir-compile\")]'",
]

[tool.cibuildwheel.linux]
environment.PYTHONDEVMODE = "1"
environment.PYTHONUNBUFFERED = "1"
environment.CMAKE_ARGS = "-DTILELANG_UPDATE_SUBMODULES=OFF -DUSE_CUDA=OFF -DUSE_ROCM=OFF -DUSE_METAL=OFF -DUSE_SUNMMIO=ON"
manylinux-x86_64-image  = "manylinux_2_28"  # AlmaLinux 8
# Do not bundle libtvm_ffi.so and libz3.so because they are shipped by the dependency packages.
repair-wheel-command = "auditwheel -v repair --exclude libtvm_ffi.so --exclude libz3.so -w {dest_dir} {wheel}"
