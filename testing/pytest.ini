[pytest]
addopts =
  --deselect=python/transform/test_tilelang_transform_lower_tile_op.py
  --deselect=python/language/test_tilelang_language_get_warp_info.py
  --ignore=python/tilelibrary
markers =
  sunmmio_toolchain: requires the closed Sunmmio compiler toolchain and SUNMMIO_TOOLCHAIN
  sunmmio_sunsim: requires the closed sunsim Python package and its runtime environment
  sunmmio_closed_runtime: requires closed Sunmmio runtime dependencies, such as the toolchain, sunsim, or gem5
